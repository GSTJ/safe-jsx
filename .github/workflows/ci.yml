name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: GSTJ/magic/.github/workflows/ci.yml@main
    with:
      node-version: "24"
      build-command: pnpm run build
      test-command: pnpm run test
      # Nothing in this repo uses turbo.
      turbo-cache: false
