# pnpm keeps its settings here rather than in package.json's "pnpm" field.

# jest-resolve ships a native resolver (unrs-resolver) whose install script
# links the platform binary. Without this, `pnpm install` exits 1 on
# ERR_PNPM_IGNORED_BUILDS.
#
# jest-haste-map's optional @parcel/watcher native binary is the same story,
# but we never run jest in --watch mode, so its build script stays denied
# instead of approved.
allowBuilds:
  unrs-resolver: true
  "@parcel/watcher": false

# Jest still reaches older minimatch lines through its coverage and resolver
# stack. Keep the transitive brace-expansion versions on their patched releases
# until Jest moves those edges forward.
#
# js-yaml 3.15.1 was a transitive dep of @istanbuljs/load-nyc-config (jest
# coverage config loading, never fed untrusted YAML here) and hit
# GHSA-2883-xcg3-v3hh (uncapped CPU use merging empty mappings). Renovate has
# since moved this override past it to the current major.
overrides:
  "brace-expansion@<1.1.17": 1.1.21
  "brace-expansion@>=2.0.0 <2.1.3": 2.1.7
  "js-yaml@3.15.1": 5.4.2

# pnpm refuses packages published more recently than `minimumReleaseAge`.
minimumReleaseAge: 20160

# magic-* is our first-party tooling, so it can move immediately. Everything
# else stays version-specific when an existing lockfile needs grandfathering.
minimumReleaseAgeExclude:
  - magic-*
  - "@oxlint/binding-android-arm-eabi@1.83.0"
  - "@oxlint/binding-android-arm64@1.83.0"
